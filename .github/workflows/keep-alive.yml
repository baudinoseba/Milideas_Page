name: Supabase Keep-Alive Ping

on:
  schedule:
    # Se ejecuta cada 3 días a las 00:00 UTC
    - cron: '0 0 */3 * *'
  workflow_dispatch: # Permite ejecución manual desde la pestaña Actions en GitHub

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase REST API
        run: |
          API_KEY="${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}${{ secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}"
          curl -s -f "${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}/rest/v1/categorias?select=id&limit=1" \
            -H "apikey: ${API_KEY}" > /dev/null

